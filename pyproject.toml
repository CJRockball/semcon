[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semcon"
version = "0.1.0"
description = "Wafer pass/fail yield prediction from inline sensor data (SECOM): leakage-free cross-validation, missingness-as-signal features, and drift-quantified evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Patrick Carlberg" }]
keywords = [
    "semiconductor",
    "yield-optimization",
    "secom",
    "xgboost",
    "machine-learning",
    "spc",
    "smart-manufacturing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
# Only what the code actually imports. Add a dependency when a module
# needs it, not before.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",        # parquet I/O in explore.py / xgb scripts
    "scikit-learn>=1.4,<2.0",    # RepeatedStratifiedKFold, metrics, mutual_info
    "xgboost==2.1.1",         # 2.x callback API (EarlyStopping save_best)
    "scipy>=1.11",          # spearmanr, connected_components, stats
    "matplotlib>=3.8",
    "seaborn>=0.13",        # EDA notebook
    "pydantic>=2.0,<3.0",
]

# Extras = optional RUNTIME features, published in package metadata.
# Install: uv pip install -e ".[notebooks,explain]"
[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.0",
    "ipykernel>=6.27",
]
# Roadmap extras: declared now so the plan is visible in the metadata;
# promote to core when the corresponding module joins the main pipeline.
timeseries = [
    "statsmodels>=0.14",    # SARIMAX tool-drift / fail-rate forecasting
]
optimization = [
    "simpy>=4.1",           # discrete-event simulation of a tool cluster
    "pulp>=2.8",            # MIP scheduling
]
explain = [
    "shap>=0.45",           # TreeSHAP model/feature evaluation (post-baseline)
]

# Dependency groups = DEVELOPER-only tooling, never published (PEP 735).
# Install: uv pip install --group dev   (or: uv pip install -e . --group dev)
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/CJRockball/semcon"

# Proper src layout: modules live in src/semcon/, so the installed
# package is `semcon` (not `src`).
[tool.hatch.build.targets.wheel]
packages = ["src/semcon"]

[project.scripts]
semcon-explore = "semcon.explore:main"
semcon-features = "semcon.feature_eng:main"
semcon-train = "semcon.train_xgb:main"
semcon-calibrate = "semcon.calibrate:main"
semcon-spc = "semcon.spc:main"
semcon-sarimax = "semcon.sarimax:main"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true   # xgboost/shap ship incomplete stubs
