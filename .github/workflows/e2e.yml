name: E2E Operational Replay

on:
  workflow_dispatch: # Enables the manual "Run workflow" button in GitHub Actions tab
  # Optional: run automatically once a week on Sunday at midnight:
  # schedule:
  #   - cron: "0 0 * * 0"

jobs:
  full-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Full pipeline execution
        run: |
          make demo
          make trigger

      - name: Assert output integrity
        run: |
          test -f artifacts/index_monitor.csv
          test -d artifacts/monitoring